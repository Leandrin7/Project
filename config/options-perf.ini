; Perfil de desempenho para ~/Zomboid/options.ini (aplicado por tune_options.py).
; Só é aplicado a chaves que JÁ existem no seu arquivo. Linhas com ';' são referência.
;
; Chaves ATIVAS: nome e semântica com boa confiança no B41 (booleans / contagens).
; Chaves COMENTADAS: escala numérica muda entre builds (0 pode ser "alto" ou "baixo").
; Confirme abrindo o menu do jogo depois de aplicar, ou extraia Core.saveOptions
; com o playbook REA (docs/05-rea-playbook.md, pergunta Q5) e descomente.

; Sincronia vertical adiciona até 1 frame de latência e "trava" em 30 FPS quando cai de 60.
; Prefira limitar FPS (frameRate) + VRR/G-Sync/FreeSync.
vsync=false

; Atualizações/s do sistema de iluminação (thread nativa LightingJNI). 15 é o padrão B41.
; Mais alto = luz mais suave ao mover lanternas, mais CPU. Não reduza abaixo de 10.
lightingFPS=15

; Sombras de cadáveres: com hordas mortas no chão é custo puro de draw call.
corpseShadows=false

; Compressão de textura: menos VRAM e banda com tilesets de mods (pequena perda visual).
textureCompression=true

; ---- referência (verifique a escala no seu build antes de descomentar) ----
; frameRate=60            ; teto de FPS; um teto estável dá frametime mais regular que FPS "livre"
; lightingQuality=2       ; 0..3 no B41 (ver menu "Qualidade da iluminação")
; fogQuality=2            ; neblina: 0 alta, 1 média, 2 legado/baixa (B41)
; perfPuddles=2           ; poças
; perfReflections=false   ; reflexos em água/poças
; perfSkybox=2            ; céu
; maxTextureSize=2        ; índice do tamanho máximo de textura de modelos
; maxVehicleTextureSize=2
; texture2x=false         ; texturas de tiles em 2x (alto custo de VRAM com zoom-out)
